    c.globalAlpha=clamp(a);c.fillStyle=bright?'#e0fcff':'#8ee8ed';
    if(bright){const g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,r*5);g.addColorStop(0,'rgba(76,226,242,.27)');g.addColorStop(1,'rgba(76,226,242,0)');c.fillStyle=g;c.beginPath();c.arc(p.x,p.y,r*5,0,Math.PI*2);c.fill();c.fillStyle='#e0fcff';}
    c.beginPath();c.arc(p.x,p.y,r,0,Math.PI*2);c.fill();c.globalAlpha=1;
  }
  function line(a,b,alpha){if(alpha<.005)return;c.globalAlpha=alpha;c.strokeStyle='#80dbe5';c.lineWidth=.8;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke();c.globalAlpha=1;}
  function outline(kind,t,alpha){const img=images[kind];if(!img||!img.complete||!img.naturalWidth||alpha<.003)return;const b=box(kind,t);c.globalAlpha=alpha;c.drawImage(img,b.x,b.y,b.w,b.h);c.globalAlpha=1;}
  function frameAt(t){
    if(!c||!width||active!==0)return;c.clearRect(0,0,width,height);
    const morph=ease(t,6.35,8.2),condense=ease(t,8.4,10.7),release=ease(t,10.85,13.45),dest=destinations(t),live=[];
    const shell=(1-morph)*ease(t,2.4,3.4);
    outline('caterpillar',t,shell*.42);
    outline('chrysalis',t,morph*(1-ease(t,10.65,11.8))*.36);
    cat.forEach((p,i)=>{
      const seed={x:width*(.08+rand(i,2)*.84),y:45+rand(i,4)*215};
      const cp=specimen('caterpillar',i,t),ch=specimen('chrysalis',i,t);
      const gather=ease(t,.8+rand(i,3)*.7,3.3+rand(i,8)*.45);
      let x=mix(seed.x+Math.sin(t*.7+i)*2,cp.x,gather),y=mix(seed.y+Math.cos(t*.6+i)*2,cp.y,gather)-Math.sin(gather*Math.PI)*14;
      if(t>3.4&&t<6.35)y+=Math.sin(t*2.4-i*.22)*1.1;
      x=mix(x,ch.x,morph);y=mix(y,ch.y,morph);
      let alpha=.75,rad=.85+Math.min(1.5,p[2]*22),idx=selectIndex.get(i);
      if(idx===undefined){
        const q=specimen('chrysalis',neighbors[i],t),angle=rand(i,9)*Math.PI*2+condense*Math.PI*2;
        const orbit=3+rand(i,5)*7,shrink=ease(t,9,10.9);
        x=mix(x,q.x+Math.cos(angle)*orbit*(1-shrink),condense);y=mix(y,q.y+Math.sin(angle)*orbit*(1-shrink),condense);
        alpha*=1-ease(t,9.65,10.95);
      }else{
        if(t<10.85){x+=Math.sin(t*2+idx)*condense*1.2;y+=Math.cos(t*1.7+idx)*condense*1.2;}
        const fly=ease(t,10.85+(idx%9)*.025,13.25+(idx%7)*.035),target=dest[idx];
        const bend=Math.sin(fly*Math.PI)*(idx<23?20:10);
        x=mix(x,target.x,fly)+bend*(rand(idx,7)-.5);y=mix(y,target.y,fly)-bend;
        const endRadius=idx<23?Math.max(1.15,original.butterfly[idx].size*4):idx<52?1.05: .8;
        const endAlpha=idx<23?original.butterfly[idx].opacity:idx<52?.46:.24;
        rad=mix(rad,endRadius,fly);alpha=mix(alpha,endAlpha,fly);live[idx]={x,y};
      }
      dot({x,y},rad,alpha,idx!==undefined&&idx<23&&t>10.85);
    });
    // Discrete signals enter the raised head, then travel into the body.
    if(t<6.5){
      const b=box('caterpillar',t),mouth={x:b.x+b.w*.88,y:b.y+b.h*.39};
      for(let i=0;i<56;i++){
        const begin=2.65+i*.053,finish=begin+.95+rand(i,14)*.3,travel=ease(t,begin,finish);
        if(travel>=1)continue;
        const sx=width*(.63+rand(i,11)*.32),sy=48+rand(i,12)*210;
        const p={x:mix(sx,mouth.x,travel),y:mix(sy,mouth.y,travel)+Math.sin(travel*Math.PI)*(rand(i,15)-.5)*28};
        dot(p,.8+rand(i,13)*.8,(1-ease(t,finish-.15,finish))*.65,travel>.5);
      }
      if(t>3.4){const wave=clamp((t-3.4)/2.9);for(let k=0;k<9;k++){let u=(wave*2.2+k/9)%1;const sample=Math.floor((.82-u*.65)*(cat.length-1));const p=specimen('caterpillar',sample,t);dot(p,1.7,Math.sin(u*Math.PI)*.35,true);}}
    }
    const links=ease(t,12.2,13.7);
    original.edges.forEach(([a,b])=>{if(live[a]&&live[b])line(live[a],live[b],links*.52);});
    original.details.forEach(d=>line(wingPosition(d,t,d.className),wingPosition({x:d.x2,y:d.y2},t,d.className),ease(t,12.8,14.1)*(d.opacity||.5)*.9));
    original.meshEdges.forEach(([a,b])=>{if(live[a+23]&&live[b+23])line(live[a+23],live[b+23],links*.18);});
    if(live[51]&&live[11])line(live[51],live[11],links*.24);
    // A brief concentration of light resolves with the butterfly; no repeating effect.
    if(t>12.9&&t<14.1){const p=wingPosition({x:82.5,y:25.4},t);dot(p,2.3,Math.sin((t-12.9)/1.2*Math.PI)*.55,true);}
    if(t>=13.15)scene.classList.add('px-origin-done');
    if(t>=total-.01){finished=true;seen=true;footer.classList.remove('px-waiting');replay.hidden=reduced.matches;}
    root.dataset.originPhase=t<3.4?'dots':t<6.35?'consumption':t<10.85?'metamorphosis':t<total?'emergence':'butterfly';
  }
  function step(now){raf=0;if(!playing||paused||!inView||document.hidden||active!==0)return;if(previous)elapsed+=(now-previous)/1000;previous=now;frameAt(Math.min(elapsed,total));if(elapsed<total)raf=requestAnimationFrame(step);else{playing=false;previous=0;}}
  function schedule(){if(playing&&!paused&&inView&&!document.hidden&&!raf&&active===0){previous=0;raf=requestAnimationFrame(step);}}
  function stop(){playing=false;cancelAnimationFrame(raf);raf=0;previous=0;}
  function resize(){const w=originCanvas.clientWidth;if(w<=0)return;width=w;height=originCanvas.clientHeight||300;const d=Math.min(window.devicePixelRatio||1,2);originCanvas.width=Math.round(w*d);originCanvas.height=Math.round(height*d);c.setTransform(d,0,0,d,0,0);frameAt(elapsed);}
  function start(animate){stop();started=true;finished=false;elapsed=frozen!==null?frozen:(reduced.matches||!animate?total:0);scene.classList.remove('px-origin-done');footer.classList.add('px-waiting');replay.hidden=true;copy.getAnimations().forEach(a=>a.cancel());resize();frameAt(elapsed);if(elapsed<total&&frozen===null){playing=true;schedule();}}
  function pause(value){paused=value;cancelAnimationFrame(raf);raf=0;previous=0;if(!value)schedule();}
  if('IntersectionObserver' in window)new IntersectionObserver(entries=>{inView=entries[0].isIntersecting;cancelAnimationFrame(raf);raf=0;previous=0;schedule();},{threshold:.1}).observe(root);
  document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);raf=0;previous=0;schedule();});
  reduced.addEventListener('change',()=>{if(reduced.matches&&active===0)start(false);});
  Object.entries(imageSources).forEach(([name,src])=>{const img=new Image();images[name]=img;img.onload=()=>{if(started&&!playing)frameAt(elapsed);};img.src=src;});
  return{start,stop,pause,resize,get hasPlayed(){return seen;}};
})();

      function setupMode(){scene.classList.toggle('px-is-home',active===0);originCanvas.hidden=active!==0;canvas.hidden=active===0;replay.hidden=true;footer.classList.toggle('px-waiting',active===0);copy.getAnimations().forEach(a=>a.cancel());if(active!==0){scene.classList.remove('px-origin-done');footer.classList.remove('px-waiting');}}
      replay.addEventListener('click',()=>origin.start(true));
      setupMode();new ResizeObserver(resize).observe(scene);renderText();resize();origin.start(true);
    })();
  </script>
